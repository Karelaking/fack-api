<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="fack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)" />
    </linearGradient>

    <!-- Trunk Gradient (Violet to Cyan) -->
    <linearGradient id="fack-trunk-grad" x1="166" y1="380" x2="350" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Mid Branch Gradient (Indigo to Fuchsia) -->
    <linearGradient id="fack-mid-grad" x1="166" y1="260" x2="290" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="fack-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Background with Sharp Corners -->
  <rect width="512" height="512" fill="url(#fack-bg)" stroke="url(#fack-border)" stroke-width="2" />

  <!-- Blueprint Canvas Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="48" y1="0" x2="48" y2="512" />
    <line x1="96" y1="0" x2="96" y2="512" />
    <line x1="144" y1="0" x2="144" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="240" y1="0" x2="240" y2="512" />
    <line x1="288" y1="0" x2="288" y2="512" />
    <line x1="336" y1="0" x2="336" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="432" y1="0" x2="432" y2="512" />
    <line x1="480" y1="0" x2="480" y2="512" />

    <line x1="0" y1="48" x2="512" y2="48" />
    <line x1="0" y1="96" x2="512" y2="96" />
    <line x1="0" y1="144" x2="512" y2="144" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="240" x2="512" y2="240" />
    <line x1="0" y1="288" x2="512" y2="288" />
    <line x1="0" y1="336" x2="512" y2="336" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="432" x2="512" y2="432" />
    <line x1="0" y1="480" x2="512" y2="480" />
  </g>

  <!-- Ambient Radial Aura -->
  <circle cx="256" cy="240" r="160" fill="#06b6d4" opacity="0.08" filter="url(#fack-glow)" />

  <!-- Route Glow Underlay -->
  <g opacity="0.4" filter="url(#fack-glow)">
    <path d="M166 380 V176 L206 136 H350" fill="none" stroke="#06b6d4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M166 260 L196 230 H290" fill="none" stroke="#d946ef" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Conduit Paths -->
  <path d="M166 380 V176 L206 136 H350" fill="none" stroke="url(#fack-trunk-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M166 260 L196 230 H290" fill="none" stroke="url(#fack-mid-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Data Light Beam (Inner Fiber) -->
  <path d="M166 380 V176 L206 136 H350" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M166 260 L196 230 H290" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 1. Root Gateway Node (Bottom) -->
  <circle cx="166" cy="380" r="28" fill="#0b0f19" stroke="#8b5cf6" stroke-width="7" />
  <circle cx="166" cy="380" r="14" fill="#c4b5fd" />

  <!-- 2. Top Route Endpoint Node (Cyan [GET]) -->
  <circle cx="350" cy="136" r="28" fill="#0b0f19" stroke="#06b6d4" stroke-width="7" />
  <circle cx="350" cy="136" r="14" fill="#38bdf8" />

  <!-- 3. Middle Route Endpoint Node (Fuchsia [POST/SCHEMA]) -->
  <circle cx="290" cy="230" r="26" fill="#0b0f19" stroke="#d946ef" stroke-width="7" />
  <circle cx="290" cy="230" r="13" fill="#f472b6" />
</svg>
